<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Camera Monitor</title>
  <style>
    :root {
      --fg: #fff; --soft: rgba(255,255,255,.72); --dim: rgba(255,255,255,.5);
      --ok: #3fb950; --warn: #e3b341; --bad: #f85149; --accent: #8ab4ff;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: var(--fg); font-family: var(--font); overflow: hidden;
      -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; user-select: none; cursor: default; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }

    /* ---------- Slides with Ken Burns ---------- */
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; overflow: hidden; }
    .slide.on { opacity: 1; }
    .slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
    @keyframes kb0 { from { transform: scale(1.02) translate(0, 0) } to { transform: scale(1.14) translate(-2.5%, -1.5%) } }
    @keyframes kb1 { from { transform: scale(1.14) translate(2%, 1%) } to { transform: scale(1.03) translate(0, 0) } }
    @keyframes kb2 { from { transform: scale(1.04) translate(1.5%, -1%) } to { transform: scale(1.15) translate(-1%, 1.5%) } }
    @keyframes kb3 { from { transform: scale(1.12) translate(-2%, 1.5%) } to { transform: scale(1.02) translate(1%, -.5%) } }

    /* ---------- Info overlay ---------- */
    .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; pointer-events: none;
      background: linear-gradient(transparent, rgba(0,0,0,.25) 35%, rgba(0,0,0,.78)); }
    .topscrim { position: absolute; left: 0; right: 0; top: 0; height: 22%; pointer-events: none;
      background: linear-gradient(rgba(0,0,0,.45), transparent); }

    .info { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; gap: 2rem;
      padding: 0 clamp(1.5rem, 4vw, 3.5rem) clamp(1.4rem, 4vh, 3rem); pointer-events: none;
      text-shadow: 0 2px 18px rgba(0,0,0,.45); }
    .time { line-height: .9; }
    .time b { display: flex; align-items: flex-start; white-space: nowrap; font-size: clamp(4.5rem, 11vw, 9.5rem); font-weight: 200; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .time b small { font-size: .26em; font-weight: 400; letter-spacing: .02em; margin: .5em 0 0 .35em; color: var(--soft); }
    .time span { display: block; font-size: clamp(1rem, 1.9vw, 1.5rem); font-weight: 400; color: var(--soft); margin-top: .6rem; }
    .info .sp { flex: 1; }
    .side { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
    .cam { display: inline-flex; align-items: center; gap: 10px; font-size: clamp(1rem, 1.7vw, 1.35rem); font-weight: 500; }
    .cam small { font-size: .78em; color: var(--dim); font-weight: 400; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); }
    .dot.ok { background: var(--ok); box-shadow: 0 0 12px var(--ok); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 12px var(--warn); }
    .dot.bad { background: var(--bad); box-shadow: 0 0 12px var(--bad); }
    .stats { display: flex; gap: clamp(1.2rem, 2.6vw, 2.4rem); }
    .stat { text-align: right; }
    .stat b { display: block; font-size: clamp(1.5rem, 2.8vw, 2.4rem); font-weight: 300; font-variant-numeric: tabular-nums; line-height: 1; }
    .stat b small { font-size: .5em; color: var(--soft); margin-left: 2px; }
    .stat span { display: block; font-size: clamp(.62rem, .9vw, .78rem); color: var(--dim); text-transform: uppercase; letter-spacing: .12em; margin-top: 6px; }
    .stat.chg b { color: #9ff0b4; } .stat.dis b { color: #ffd98a; }

    /* Rotation hairline */
    .rot { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: rgba(255,255,255,.55); }
    @keyframes rot { from { width: 0 } to { width: 100% } }

    /* ---------- Tap-to-reveal dock ---------- */
    .dock { position: absolute; top: clamp(1rem, 3vh, 2rem); left: 50%; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
      display: flex; gap: 6px; padding: 7px; border-radius: 20px; background: rgba(20,20,24,.62); backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3); border: 1px solid rgba(255,255,255,.1); transition: opacity .3s, transform .3s; z-index: 5; }
    .dock.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .dock button { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; color: var(--soft); position: relative; }
    .dock button:hover, .dock button.act { background: rgba(255,255,255,.12); color: #fff; }
    .dock button svg { width: 22px; height: 22px; }
    .dock .sep { width: 1px; margin: 8px 2px; background: rgba(255,255,255,.12); }
    .dock .badge { position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px;
      background: var(--bad); color: #fff; font-size: .6rem; font-weight: 700; line-height: 16px; }

    /* ---------- Clip stage (alerts / timelapses), same overlay as the stills ---------- */
    .vstage { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .8s ease; pointer-events: none; }
    body.clips .vstage { opacity: 1; }
    .vstage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
    .vstage video.on { opacity: 1; }
    .dot.tl { background: var(--accent); box-shadow: 0 0 12px var(--accent); }

    /* Mode switch (upper left) */
    .modes { position: absolute; top: clamp(1rem, 3vh, 2rem); left: clamp(1rem, 3vw, 2.2rem); display: flex; gap: 2px; padding: 4px; z-index: 4;
      border-radius: 99px; background: rgba(20,20,24,.45); backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
      border: 1px solid rgba(255,255,255,.1); }
    .modes button { display: inline-flex; align-items: center; gap: 7px; padding: 9px 15px; border-radius: 99px; font-size: .88rem; font-weight: 600;
      color: var(--soft); white-space: nowrap; transition: background .25s, color .25s; }
    .modes button svg { width: 17px; height: 17px; }
    .modes button.on { background: rgba(255,255,255,.92); color: #111; }
    .modes .n { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--bad); color: #fff; font-size: .68rem;
      font-weight: 700; line-height: 19px; text-align: center; font-style: normal; }
    .modes .n:empty { display: none; }

    .dock .grp { display: flex; gap: 6px; }
    .dock .grp[hidden] { display: none; }
    .dock button.txt { width: auto; padding: 0 16px; display: inline-flex; gap: 8px; font-size: .9rem; font-weight: 600; white-space: nowrap; }
    .dock button.txt.bad:hover { color: #ffb4ae; }
    /* In clip mode the dock is wider; sit it top-right so it clears the mode switch */
    body.clips .dock { left: auto; right: clamp(1rem, 3vw, 2.2rem); transform: translateY(-12px); }
    body.clips .dock.on { transform: none; }
    @media (max-width: 1100px) { .dock button.txt { width: 52px; padding: 0; } .dock button.txt span { display: none; } }

    .toast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.96); display: flex; align-items: center; gap: 10px;
      padding: 14px 22px; border-radius: 16px; background: rgba(20,20,24,.7); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      font-weight: 600; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; z-index: 6; }
    .toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .toast svg { width: 20px; height: 20px; }

    .paused { position: absolute; top: calc(clamp(1rem, 3vh, 2rem) + 58px); left: clamp(1rem, 3vw, 2.2rem); display: none; align-items: center; gap: 8px;
      padding: 7px 12px; border-radius: 99px; background: rgba(0,0,0,.45); font-size: .78rem; font-weight: 600; color: var(--soft); }
    .paused.on { display: inline-flex; }
    .paused svg { width: 14px; height: 14px; }

    /* Camera picker sheet */
    .sheet { position: absolute; inset: 0; z-index: 8; background: rgba(0,0,0,.82); backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px); display: none; flex-direction: column; padding: 1.5rem; gap: 1rem; }
    .sheet.on { display: flex; }
    .sheet header { display: flex; align-items: center; justify-content: space-between; font-size: 1.2rem; font-weight: 600; }
    .sheet header button { width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.08); display: grid; place-items: center; }
    .sheet header svg { width: 20px; height: 20px; }
    .pick { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; overflow-y: auto; align-content: start; }
    .pick button { position: relative; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #111; outline: 2px solid transparent; outline-offset: 2px; }
    .pick button.cur { outline-color: var(--accent); }
    .pick img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pick span { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 10px 8px; text-align: left; font-size: .85rem; font-weight: 600;
      background: linear-gradient(transparent, rgba(0,0,0,.8)); }

    .err { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 2rem; color: #ffb4ae; font-size: 1.1rem; }
    .err.on { display: grid; }

    @media (max-width: 760px) { .stats .stat:nth-child(n+4) { display: none; } .modes button:not(.on) span { display: none; } }
  </style>
</head>
<body>
  <div class="slide"><img alt="" /></div>
  <div class="slide"><img alt="" /></div>
  <div class="vstage" id="vstage"><video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video></div>
  <div class="topscrim"></div>
  <div class="scrim"></div>

  <div class="info">
    <div class="time"><b id="clock"></b><span id="date"></span></div>
    <div class="sp"></div>
    <div class="side">
      <div class="cam"><span class="dot" id="dot"></span><span id="cam"></span><small id="when"></small></div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="rot" id="rot"></div>

  <div class="modes" id="modes">
    <button data-m="live" class="on"></button>
    <button data-m="alerts"></button>
    <button data-m="timelapses"></button>
  </div>
  <div class="paused" id="paused"></div>
  <div class="toast" id="toast"></div>

  <nav class="dock" id="dock">
    <button id="d-prev" title="Previous"></button>
    <button id="d-play" title="Pause"></button>
    <button id="d-next" title="Next"></button>
    <span class="sep"></span>
    <span class="grp" id="g-live"><button id="d-grid" title="Choose camera"></button></span>
    <span class="grp" id="g-clip" hidden></span>
    <span class="sep"></span>
    <button id="d-fs"></button>
  </nav>

  <div class="sheet" id="sheet">
    <header><span>Cameras</span><button id="sheet-close" title="Close"></button></header>
    <div class="pick" id="pick"></div>
  </div>

  <div class="err" id="err"></div>

  <script src="/core.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const slides = [...document.querySelectorAll('.slide')];
    const vids = [...document.querySelectorAll('#vstage video')];
    let cfg = null, cameras = [], idx = 0, cur = 0, playing = true, timer = null, hideT = null, toastT = null, kb = 0;
    let alertsList = [], status = null;
    // mode: 'live' (camera stills) | 'alerts' (new review clips) | 'timelapses'
    let mode = 'live', clips = [], pos = 0, act = 0, busy = false;

    $('d-prev').innerHTML = CM.svg('prev'); $('d-next').innerHTML = CM.svg('next');
    $('d-grid').innerHTML = CM.svg('grid');
    $('sheet-close').innerHTML = CM.svg('close');
    CM.fullscreenButton($('d-fs'));
    const modeBtn = m => document.querySelector(`.modes [data-m="${m}"]`);
    modeBtn('live').innerHTML = `${CM.svg('camera')}<span>Live</span>`;
    modeBtn('alerts').innerHTML = `${CM.svg('bell')}<span>Alerts</span><i class="n" id="m-n"></i>`;
    modeBtn('timelapses').innerHTML = `${CM.svg('film')}<span>Timelapses</span>`;

    function clock() {
      const parts = new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit' }).formatToParts(new Date());
      const main = parts.filter(p => p.type !== 'dayPeriod').map(p => p.value).join('').trim();
      const per = (parts.find(p => p.type === 'dayPeriod') || {}).value || '';
      $('clock').innerHTML = `${CM.esc(main)}${per ? `<small>${CM.esc(per)}</small>` : ''}`;
      $('date').textContent = CM.date();
    }
    function toast(msg, icon = 'check') {
      $('toast').innerHTML = `${CM.svg(icon)}${CM.esc(msg)}`;
      $('toast').classList.add('on');
      clearTimeout(toastT);
      toastT = setTimeout(() => $('toast').classList.remove('on'), 1800);
    }
    function restartRot() {
      const r = $('rot'); r.style.animation = 'none'; r.style.width = ''; void r.offsetWidth;
      if (playing) r.style.animation = `rot ${cfg.rotation_interval}s linear forwards`;
    }

    // ---------- Slides ----------
    function paintCam() {
      if (mode !== 'live') return;
      const cam = cameras[idx]; if (!cam) return;
      const f = CM.fresh(status);
      $('dot').className = `dot ${f.state}`;
      $('cam').textContent = cam.name;
      $('when').textContent = f.state === 'bad' ? 'capture failing' : f.t ? CM.rel(f.t) : '';
    }
    async function show(i) {
      idx = (i + cameras.length) % cameras.length;
      const cam = cameras[idx];
      status = await CM.status(cam.id);
      try {
        const img = await CM.loadImage(CM.frameSrc(cam.id));
        const next = slides[1 - cur];
        const el = next.querySelector('img');
        el.src = img.src;
        el.style.animation = 'none'; void el.offsetWidth;
        el.style.animation = `kb${kb++ % 4} ${cfg.rotation_interval + 4}s ease-in-out forwards`;
        next.classList.add('on'); slides[cur].classList.remove('on');
        cur = 1 - cur;
      } catch { /* keep previous */ }
      if (mode !== 'live') return;
      paintCam();
      restartRot();
      document.querySelectorAll('.pick button').forEach((b, n) => b.classList.toggle('cur', n === idx));
    }

    // ---------- Clips (double-buffered: the next clip preloads in the idle video) ----------
    const A = () => vids[act], I = () => vids[1 - act];
    function preload(v, i) {
      if (i >= 0 && i < clips.length) {
        if (v.dataset.i !== String(i)) { v.src = clips[i].clip_url; v.dataset.i = String(i); v.load(); }
      } else { v.removeAttribute('src'); v.dataset.i = ''; }
    }
    function paintClip() {
      const it = clips[pos]; if (!it) return;
      const tl = mode === 'timelapses';
      $('dot').className = `dot ${tl ? 'tl' : it.severity === 'alert' ? 'bad' : 'warn'}`;
      $('cam').textContent = it.camera;
      $('when').textContent = `${tl ? CM.timelapseMeta(it) : CM.reviewMeta(it)} · ${pos + 1} of ${clips.length}`;
    }
    function playClip(i, seamless = false) {
      if (mode === 'live') return;
      if (!clips.length) { toast(mode === 'alerts' ? 'All caught up' : 'Nothing to play'); setMode('live'); return; }
      i = ((i % clips.length) + clips.length) % clips.length;   // loop through the queue
      pos = i;
      if (seamless && I().dataset.i === String(i)) act = 1 - act; else preload(A(), i);
      vids.forEach((v, n) => v.classList.toggle('on', n === act));
      I().pause();
      if (playing) A().play().catch(() => {});
      preload(I(), (i + 1) % clips.length);
      const r = $('rot'); r.style.animation = 'none'; r.style.width = '0%';
      paintClip();
    }
    vids.forEach(v => {
      v.addEventListener('timeupdate', () => {
        if (v !== A() || mode === 'live') return;
        const d = v.duration;
        $('rot').style.width = d && isFinite(d) ? `${(v.currentTime / d) * 100}%` : '0%';
      });
      v.addEventListener('ended', () => { if (v === A() && mode !== 'live') playClip(pos + 1, true); });
    });

    const ACT = { discard: ['Discard', 'trash', 'Discarded'], keep7: ['Keep 7 days', 'clock', 'Kept for 7 days'],
                  keep_forever: ['Keep forever', 'infinity', 'Kept forever'] };
    function renderActions() {
      const list = mode === 'alerts' ? ['discard', 'keep7', 'keep_forever'] : mode === 'timelapses' ? ['keep7', 'keep_forever'] : [];
      $('g-clip').innerHTML = list.map(a =>
        `<button class="txt ${a === 'discard' ? 'bad' : ''}" data-r="${a}">${CM.svg(ACT[a][1])}<span>${ACT[a][0]}</span></button>`).join('')
        + (mode === 'timelapses' && cfg.allow_download ? `<button data-dl="1" title="Download">${CM.svg('download')}</button>` : '');
      $('g-clip').hidden = mode === 'live';
      $('g-live').hidden = mode !== 'live';
      $('d-prev').title = mode === 'live' ? 'Previous camera' : 'Previous clip';
      $('d-next').title = mode === 'live' ? 'Next camera' : 'Skip';
    }
    async function decide(r) {
      const it = clips[pos], m = mode;
      if (busy || !it) return;
      busy = true;
      await CM.retain(m === 'timelapses' ? 'timelapse' : 'review', it.id, r);
      busy = false;
      if (mode !== m) return;
      toast(ACT[r][2], ACT[r][1]);
      if (m === 'timelapses') { it.retention = r; playClip(pos + 1); }
      else { clips.splice(pos, 1); vids.forEach(v => { v.dataset.i = ''; }); playClip(Math.min(pos, clips.length - 1)); refreshAlerts(); }
    }
    $('g-clip').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.dl) { const x = document.createElement('a'); x.href = `${clips[pos].clip_url}?download=1`; x.click(); return; }
      decide(b.dataset.r);
    });

    // ---------- Modes ----------
    function setMode(m) {
      const was = mode;
      mode = m;
      document.body.classList.toggle('clips', m !== 'live');
      document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
      renderActions();
      refreshCount();
      if (m === 'live' && was !== 'live') {
        vids.forEach(v => v.pause());
        // Let the clip stage fade out before releasing the videos
        setTimeout(() => { if (mode === 'live') vids.forEach(v => { v.removeAttribute('src'); v.dataset.i = ''; v.load(); v.classList.remove('on'); }); }, 900);
        setPlaying(true);
        clearInterval(timer); timer = setInterval(tick, cfg.rotation_interval * 1000);
        show(idx);
      }
    }
    async function enterClips(m) {
      if (m === mode) return;
      const items = m === 'alerts' ? await CM.reviews('new') : await CM.timelapses();
      if (!items.length) { toast(m === 'alerts' ? 'No new alerts' : 'No timelapses yet', m === 'alerts' ? 'check' : 'film'); return; }
      clips = items; act = 0;
      vids.forEach(v => { v.dataset.i = ''; });
      setMode(m);
      setPlaying(true);
      playClip(0);
    }
    $('modes').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.m === 'live') setMode('live'); else enterClips(b.dataset.m);
    });

    // ---------- Stats ----------
    async function refreshStats() {
      const stats = await CM.stats(); if (!stats) return;
      CM.record(stats);
      $('stats').innerHTML = stats.map(s => {
        const k = CM.kind(s);
        let num = CM.fmt(s), cls = '';
        if (k === 'net' && s.value != null) { cls = s.value > 0.02 ? 'chg' : s.value < -0.02 ? 'dis' : ''; num = (s.value > 0 ? '+' : '') + num; }
        const unit = k === 'temp' ? '°' : CM.esc(s.unit);
        return `<div class="stat ${cls}"><b>${num}<small>${unit}</small></b><span>${CM.esc(s.label)}</span></div>`;
      }).join('');
    }

    // ---------- Alerts ----------
    function refreshCount() {
      const n = mode === 'alerts' ? clips.length : alertsList.length;
      $('m-n').textContent = n ? (n > 99 ? '99+' : String(n)) : '';
    }
    async function refreshAlerts() {
      alertsList = await CM.reviews('new');
      refreshCount();
    }

    // ---------- Controls ----------
    function revealDock() {
      $('dock').classList.add('on');
      clearTimeout(hideT);
      hideT = setTimeout(() => $('dock').classList.remove('on'), 6000);
    }
    function setPlaying(p) {
      playing = p;
      $('d-play').innerHTML = CM.svg(p ? 'pause' : 'play');
      $('d-play').title = p ? 'Pause' : 'Play';
      $('paused').classList.toggle('on', !p);
      $('paused').innerHTML = `${CM.svg('pause')}${mode === 'live' ? 'Paused on this camera' : 'Paused'}`;
      if (mode === 'live') {
        const r = $('rot'); r.style.animation = 'none';
        if (p) { void r.offsetWidth; r.style.animation = `rot ${cfg.rotation_interval}s linear forwards`; }
      } else if (p) A().play().catch(() => {}); else A().pause();
    }
    document.addEventListener('click', e => {
      if (e.target.closest('.dock, .sheet, .modes')) return;
      if ($('dock').classList.contains('on')) $('dock').classList.remove('on'); else revealDock();
    });
    $('dock').addEventListener('click', revealDock);
    $('d-prev').addEventListener('click', () => (mode === 'live' ? show(idx - 1) : playClip(pos - 1)));
    $('d-next').addEventListener('click', () => (mode === 'live' ? show(idx + 1) : playClip(pos + 1)));
    $('d-play').addEventListener('click', () => setPlaying(!playing));
    $('d-grid').addEventListener('click', () => {
      $('pick').replaceChildren(...cameras.map((c, i) => {
        const b = document.createElement('button');
        b.className = i === idx ? 'cur' : '';
        b.innerHTML = `<img alt="" src="${CM.frameSrc(c.id)}" /><span></span>`;
        b.querySelector('span').textContent = c.name;
        b.addEventListener('click', () => { $('sheet').classList.remove('on'); show(i); });
        return b;
      }));
      $('sheet').classList.add('on');
    });
    $('sheet-close').addEventListener('click', () => $('sheet').classList.remove('on'));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && mode !== 'live') setMode('live');
      else if (e.key === 'ArrowRight') $('d-next').click();
      else if (e.key === 'ArrowLeft') $('d-prev').click();
    });

    // ---------- Loop ----------
    async function tick() {
      if (mode === 'live') {
        if (playing) show(idx + 1); else { status = await CM.status(cameras[idx].id); paintCam(); }
      }
      if (cfg.show_stats) refreshStats();
      if (cfg.allow_review) refreshAlerts();
    }

    async function init() {
      clock(); setInterval(clock, 10000); setInterval(paintCam, 1000);
      try { cfg = await CM.config(); }
      catch (e) { $('err').textContent = `Failed to load configuration: ${e.message}`; $('err').classList.add('on'); return; }
      cameras = cfg.cameras;
      if (!cfg.show_stats) $('stats').style.display = 'none';
      if (!cfg.allow_review) modeBtn('alerts').style.display = 'none';
      if (!cfg.allow_timelapse) modeBtn('timelapses').style.display = 'none';
      if (!cfg.allow_review && !cfg.allow_timelapse) $('modes').style.display = 'none';
      if (!cameras.length) { $('err').textContent = 'No cameras are configured.'; $('err').classList.add('on'); return; }
      renderActions();
      setPlaying(true);
      await show(0);
      if (cfg.show_stats) refreshStats();
      if (cfg.allow_review) refreshAlerts();
      timer = setInterval(tick, cfg.rotation_interval * 1000);
    }
    init();
  </script>
</body>
</html>
