<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body { display: flex; flex-direction: column; }

    /* ---- Top bar ---- */

    #topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      min-height: 3.75rem;
      padding: 0.5rem 1rem;
      background: #111;
      border-bottom: 1px solid #2a2a2a;
      color: #fff;
      user-select: none;
    }

    .cam-info {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 12rem;
      max-width: 22rem;
    }

    #camera-name {
      font-size: 1.15rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #fetched-at { font-size: 0.8rem; color: #aaa; }

    .fetch-error {
      font-size: 0.75rem;
      color: #ff8888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats {
      flex: 1 1 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      gap: 0.5rem 1.25rem;
      min-width: 0;
    }

    .stat { display: flex; flex-direction: column; align-items: center; }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #aaa;
    }

    .stat-value { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
    .stat.stale .stat-value { color: #777; }

    .name-row { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }

    .icon-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.75rem;
      height: 1.75rem;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }

    .icon-btn:hover { background: rgba(255, 255, 255, 0.3); }
    .icon-btn:disabled { opacity: 0.4; cursor: default; }
    .icon-btn svg { width: 1rem; height: 1rem; }

    /* ---- Mode selector ---- */

    #mode-select {
      flex: 0 0 auto;
      display: flex;
      gap: 0.35rem;
    }

    /* Chromeless icon buttons: no border/background, dim until active/hovered */
    #mode-select button {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      background: none;
      border: none;
      border-radius: 5px;
      color: #7d7d7d;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }

    #mode-select button svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #mode-select button:hover { color: #e8e8e8; background: rgba(255, 255, 255, 0.08); }
    #mode-select button.active { color: #fff; box-shadow: inset 0 -2px 0 #4f8cff; }

    #mode-select button .badge {
      position: absolute;
      top: -3px;
      right: -3px;
      min-width: 1.05rem;
      padding: 0 0.25rem;
      border-radius: 0.6rem;
      background: #d4452c;
      color: #fff;
      font-size: 0.68rem;
      line-height: 1.05rem;
      text-align: center;
      pointer-events: none;
    }

    /* ---- Main area ---- */

    #main {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* Single camera: fill width, crop top/bottom */
    #frame {
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      display: block;
      cursor: pointer;
    }

    #grid {
      display: none;
      width: 100%;
      height: 100%;
      gap: 2px;
      grid-template-columns: repeat(var(--cols, 1), 1fr);
      grid-template-rows: repeat(var(--rows, 1), 1fr);
    }

    #player {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Mode-driven visibility */
    body.mode-grid #frame { display: none; }
    body.mode-grid #grid { display: grid; }
    body.mode-new #frame, body.mode-retained #frame, body.mode-timelapse #frame { display: none; }
    body.mode-new #player, body.mode-retained #player, body.mode-timelapse #player { display: block; }
    body:not(.mode-single) #download-btn { display: none; }

    .tile {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #111;
      cursor: pointer;
    }

    .tile img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .tile-name {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 0.8rem;
      padding: 0.15rem 0.45rem;
      border-radius: 3px;
      pointer-events: none;
    }

    .tile.missing::after {
      content: 'No image';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 0.85rem;
    }

    /* ---- Review actions overlay ---- */

    #review-actions {
      display: none;
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      gap: 0.75rem;
      z-index: 5;
    }

    body.mode-new #review-actions, body.mode-retained #review-actions, body.mode-timelapse #review-actions { display: flex; }

    #review-actions button {
      border: none;
      border-radius: 6px;
      padding: 0.7rem 1.2rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: rgba(40, 40, 40, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    #review-actions button:hover { background: rgba(70, 70, 70, 0.9); }
    #review-actions button.discard { background: rgba(150, 40, 30, 0.85); border-color: #d4452c; }
    #review-actions button.discard:hover { background: rgba(185, 50, 35, 0.9); }
    #review-actions button.keep { background: rgba(30, 90, 50, 0.85); border-color: #2e8b57; }
    #review-actions button.keep:hover { background: rgba(35, 110, 60, 0.9); }
    #review-actions button:disabled { opacity: 0.5; cursor: default; }

    /* Playback progress (fill only, not seekable) */
    #progress {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 6;
    }
    body.mode-new #progress, body.mode-retained #progress, body.mode-timelapse #progress { display: block; }
    #progress-fill {
      height: 100%;
      width: 0;
      background: #2a5bd7;
      transition: width 0.1s linear;
    }

    #review-empty {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      color: #aaa;
      font-size: 1.1rem;
      text-align: center;
      padding: 2rem;
    }
    #review-empty.visible { display: flex; }

    #error-overlay {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      color: #ff5555;
      font-size: 1.1rem;
      text-align: center;
      padding: 2rem;
    }
    #error-overlay.visible { display: flex; }
  </style>
</head>
<body class="mode-single">
  <header id="topbar">
    <div class="cam-info">
      <div class="name-row">
        <p id="camera-name"></p>
        <button id="download-btn" class="icon-btn" title="Download original" aria-label="Download original" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 4v12" /><path d="M6 10l6 6 6-6" /><path d="M5 20h14" />
          </svg>
        </button>
      </div>
      <p id="fetched-at"></p>
      <p id="fetch-error" class="fetch-error"></p>
    </div>
    <div class="stats" id="stats"></div>
    <nav id="mode-select"></nav>
  </header>

  <main id="main">
    <img id="frame" alt="" />
    <div id="grid"></div>
    <video id="player" muted playsinline></video>
    <div id="progress"><div id="progress-fill"></div></div>
    <div id="review-actions"></div>
    <div id="review-empty"></div>
    <div id="error-overlay" role="alert"><span id="error-msg"></span></div>
  </main>

  <script>
    const frameEl    = document.getElementById('frame');
    const nameEl     = document.getElementById('camera-name');
    const fetchedEl  = document.getElementById('fetched-at');
    const fetchErrEl = document.getElementById('fetch-error');
    const dlBtn      = document.getElementById('download-btn');
    const errorEl    = document.getElementById('error-overlay');
    const errorMsgEl = document.getElementById('error-msg');
    const gridEl     = document.getElementById('grid');
    const statsEl    = document.getElementById('stats');
    const modeNav    = document.getElementById('mode-select');
    const player     = document.getElementById('player');
    const actionsEl  = document.getElementById('review-actions');
    const emptyEl    = document.getElementById('review-empty');
    const progressFill = document.getElementById('progress-fill');

    let cameras = [];
    let rotationInterval = 10;
    let currentIndex = 0;
    let tiles = [];
    let showStats = true;
    let allowReview = true;
    let allowTimelapse = true;

    // mode: 'single' | 'grid' | 'new' | 'retained' | 'timelapse'
    let mode = 'single';
    let playlist = [];
    let playIndex = 0;
    let newCount = 0;

    // ---- Error overlay ----

    function showError(msg) {
      errorMsgEl.textContent = msg;
      errorEl.classList.add('visible');
      frameEl.style.visibility = 'hidden';
    }
    function hideError() {
      errorEl.classList.remove('visible');
      frameEl.style.visibility = 'visible';
    }

    // ---- Single camera ----

    async function showCamera(index, skipped = 0) {
      if (skipped >= cameras.length) {
        showError('No cameras are currently available.');
        return;
      }
      currentIndex = index;
      const camera = cameras[index];
      try {
        const [resp, status] = await Promise.all([
          fetch(`/api/frame/${camera.id}?_=${Date.now()}`),
          fetch(`/api/status/${camera.id}?_=${Date.now()}`)
            .then(r => (r.ok ? r.json() : null)).catch(() => null),
        ]);
        if (!resp.ok) throw new Error('fetch failed');
        const url = URL.createObjectURL(await resp.blob());
        frameEl.onload = () => {
          URL.revokeObjectURL(url);
          if (mode !== 'single') return;
          nameEl.textContent = camera.name;
          fetchedEl.textContent = status?.last_fetched_utc
            ? `Fetched ${new Date(status.last_fetched_utc).toLocaleString()}`
            : 'Fetch time unknown';
          fetchErrEl.textContent = status?.last_error ? `Last attempt failed: ${status.last_error}` : '';
          fetchErrEl.title = status?.last_error || '';
          dlBtn.disabled = false;
          hideError();
        };
        frameEl.src = url;
      } catch {
        if (mode !== 'single') return;
        showCamera((index + 1) % cameras.length, skipped + 1);
      }
    }

    // ---- Stats ----

    function formatStat(s) {
      if (s.state == null || s.state === 'unavailable' || s.state === 'unknown') return '—';
      const num = Number(s.state);
      const value = s.decimals != null && s.state !== '' && !Number.isNaN(num) ? num.toFixed(s.decimals) : s.state;
      if (!s.unit) return value;
      return s.unit === '%' ? `${value}%` : `${value} ${s.unit}`;
    }

    async function refreshStats() {
      if (!showStats) return;
      let stats;
      try {
        const resp = await fetch(`/api/stats?_=${Date.now()}`);
        if (!resp.ok) return;
        stats = (await resp.json()).stats;
      } catch { return; }
      if (statsEl.children.length !== stats.length) {
        statsEl.replaceChildren(...stats.map(() => {
          const el = document.createElement('div');
          el.className = 'stat';
          el.innerHTML = '<span class="stat-label"></span><span class="stat-value"></span>';
          return el;
        }));
      }
      stats.forEach((s, i) => {
        const el = statsEl.children[i];
        el.querySelector('.stat-label').textContent = s.label;
        el.querySelector('.stat-value').textContent = formatStat(s);
        el.classList.toggle('stale', Boolean(s.last_error));
        el.title = s.last_error ? `${s.entity_id}: ${s.last_error}` : (s.entity_id || 'No entity configured');
      });
    }

    // ---- Grid ----

    function buildGrid() {
      tiles.forEach(t => t.url && URL.revokeObjectURL(t.url));
      gridEl.replaceChildren();
      const cols = Math.ceil(Math.sqrt(cameras.length));
      gridEl.style.setProperty('--cols', cols);
      gridEl.style.setProperty('--rows', Math.ceil(cameras.length / cols));
      tiles = cameras.map((camera, index) => {
        const tile = document.createElement('div');
        tile.className = 'tile missing';
        const img = document.createElement('img');
        img.alt = '';
        const label = document.createElement('span');
        label.className = 'tile-name';
        label.textContent = camera.name;
        tile.append(img, label);
        tile.addEventListener('click', () => { setMode('single'); showCamera(index); });
        gridEl.appendChild(tile);
        return { tile, img, url: null };
      });
    }

    async function refreshTile(index) {
      const t = tiles[index];
      try {
        const resp = await fetch(`/api/frame/${cameras[index].id}?_=${Date.now()}`);
        if (!resp.ok) throw new Error('fetch failed');
        const url = URL.createObjectURL(await resp.blob());
        t.img.onload = () => {
          if (t.url) URL.revokeObjectURL(t.url);
          t.url = url;
          t.tile.classList.remove('missing');
        };
        t.img.src = url;
      } catch { /* keep last image */ }
    }

    function refreshGrid() { tiles.forEach((_, index) => refreshTile(index)); }

    frameEl.addEventListener('click', () => setMode('grid'));

    dlBtn.addEventListener('click', async () => {
      dlBtn.disabled = true;
      try {
        const camera = cameras[currentIndex];
        if (!camera) return;
        const resp = await fetch(`/api/frame/${camera.id}/original`);
        if (!resp.ok) throw new Error('download failed');
        const url = URL.createObjectURL(await resp.blob());
        const a = document.createElement('a');
        a.href = url;
        a.download = `${nameEl.textContent || 'frame'}.jpg`;
        a.click();
        URL.revokeObjectURL(url);
      } catch { /* silent */ } finally { dlBtn.disabled = false; }
    });

    // ---- Clip player (review + timelapse modes) ----

    function reviewMeta(r) {
      const when = r.start_time ? new Date(r.start_time * 1000).toLocaleString() : '';
      const objs = (r.objects || []).join(', ');
      const sev = (r.severity || '').toUpperCase();
      return [sev, objs, r.duration != null ? `${r.duration}s` : '', when].filter(Boolean).join(' · ');
    }

    function timelapseMeta(t) {
      const end = t.covers_end_utc ? new Date(t.covers_end_utc).toLocaleString() : '';
      const kept = t.retention === 'keep_forever' ? 'KEPT ∞' : t.retention === 'keep7' ? 'KEPT 7d' : '';
      return ['TIMELAPSE', t.frame_count != null ? `${t.frame_count} frames` : '', end ? `to ${end}` : '', kept]
        .filter(Boolean).join(' · ');
    }

    const DECIDE = {
      discard: { label: 'Discard', cls: 'discard' },
      keep7: { label: 'Keep 7 days', cls: 'keep' },
      keep_forever: { label: 'Keep forever', cls: 'keep' },
    };

    const PLAYER_MODES = {
      new: {
        url: '/api/reviews?status=new', key: 'reviews', title: 'New alerts & detections',
        empty: 'No new alerts or detections.', meta: reviewMeta,
        actions: ['discard', 'keep7', 'keep_forever'],
        retentionUrl: id => `/api/reviews/${id}/retention`, removeOnDecide: true,
      },
      retained: {
        url: '/api/reviews?status=retained', key: 'reviews', title: 'Retained clips',
        empty: 'No retained clips.', meta: reviewMeta,
        actions: ['discard', 'keep_forever', 'skip'],
        retentionUrl: id => `/api/reviews/${id}/retention`, removeOnDecide: true,
      },
      timelapse: {
        url: '/api/timelapses', key: 'timelapses', title: 'Timelapses',
        empty: 'No timelapses yet.', meta: timelapseMeta,
        actions: ['keep7', 'keep_forever', 'skip'],
        retentionUrl: id => `/api/timelapses/${id}/retention`, removeOnDecide: false,
      },
    };

    const isPlayerMode = () => mode in PLAYER_MODES;

    async function loadPlaylist() {
      const m = PLAYER_MODES[mode];
      try {
        const resp = await fetch(`${m.url}${m.url.includes('?') ? '&' : '?'}_=${Date.now()}`);
        if (!resp.ok) return [];
        return (await resp.json())[m.key];
      } catch { return []; }
    }

    function showPlayerEmpty() {
      const m = PLAYER_MODES[mode];
      player.pause();
      player.removeAttribute('src');
      player.load();
      nameEl.textContent = m.title;
      fetchedEl.textContent = '';
      fetchErrEl.textContent = '';
      emptyEl.textContent = m.empty;
      emptyEl.classList.add('visible');
    }

    function playItem(i) {
      if (!isPlayerMode()) return;
      if (i >= playlist.length) { enterPlayer(mode); return; }   // end: reload list
      playIndex = i;
      const item = playlist[i];
      progressFill.style.width = '0%';
      emptyEl.classList.remove('visible');
      nameEl.textContent = item.camera;
      fetchedEl.textContent = PLAYER_MODES[mode].meta(item);
      fetchErrEl.textContent = `${i + 1} of ${playlist.length}`;
      player.src = `${item.clip_url}?_=${Date.now()}`;
      player.load();
      player.play().catch(() => { /* autoplay allowed because muted */ });
    }

    player.addEventListener('timeupdate', () => {
      const d = player.duration;
      progressFill.style.width = (d && isFinite(d)) ? `${(player.currentTime / d) * 100}%` : '0%';
    });
    player.addEventListener('ended', () => {
      progressFill.style.width = '100%';
      if (isPlayerMode()) playItem(playIndex + 1);
    });

    async function enterPlayer() {
      playlist = await loadPlaylist();
      playIndex = 0;
      buildPlayerActions();
      if (!playlist.length) { showPlayerEmpty(); return; }
      playItem(0);
    }

    function setActionsDisabled(v) {
      actionsEl.querySelectorAll('button').forEach(b => { b.disabled = v; });
    }

    async function decide(action) {
      if (action === 'skip') { playItem(playIndex + 1); return; }
      const m = PLAYER_MODES[mode];
      const item = playlist[playIndex];
      if (!item) return;
      setActionsDisabled(true);
      try {
        await fetch(m.retentionUrl(item.id), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ retention: action }),
        });
      } catch { /* ignore; still advance */ }
      setActionsDisabled(false);
      if (m.removeOnDecide) {
        playlist.splice(playIndex, 1);
        if (!playlist.length) { showPlayerEmpty(); return; }
        playItem(Math.min(playIndex, playlist.length - 1));
      } else {
        item.retention = action;   // reflect the new state locally
        playItem(playIndex + 1);
      }
    }

    function buildPlayerActions() {
      const specs = PLAYER_MODES[mode].actions.map(a =>
        a === 'skip'
          ? { label: 'Skip', cls: '', act: () => decide('skip') }
          : { label: DECIDE[a].label, cls: DECIDE[a].cls, act: () => decide(a) });
      actionsEl.replaceChildren(...specs.map(s => {
        const b = document.createElement('button');
        b.className = s.cls;
        b.textContent = s.label;
        b.addEventListener('click', s.act);
        return b;
      }));
    }

    // ---- Mode switching ----

    function setMode(next) {
      if (next === mode) return;
      if ((next === 'new' || next === 'retained') && !allowReview) return;
      if (next === 'timelapse' && !allowTimelapse) return;

      // leaving a player mode for a non-player mode: stop playback
      if (isPlayerMode() && !(next in PLAYER_MODES)) {
        player.pause();
        player.removeAttribute('src');
        player.load();
        emptyEl.classList.remove('visible');
      }

      mode = next;
      document.body.className = `mode-${mode}`;
      updateModeButtons();

      if (mode === 'single') { hideError(); showCamera(currentIndex); }
      else if (mode === 'grid') { hideError(); nameEl.textContent = 'All Cameras'; fetchedEl.textContent = ''; fetchErrEl.textContent = ''; refreshGrid(); }
      else { hideError(); enterPlayer(); }
    }

    function updateModeButtons() {
      modeNav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      const badge = modeNav.querySelector('[data-mode="new"] .badge');
      if (badge) { badge.textContent = newCount; badge.style.display = newCount > 0 ? '' : 'none'; }
    }

    const MODE_ICONS = {
      // camcorder
      single: '<path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/>',
      // 2x2 grid
      grid: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 12h18"/><path d="M12 3v18"/>',
      // bell
      new: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
      // bookmark
      retained: '<path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>',
      // film strip (timelapse)
      timelapse: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M17 3v18"/><path d="M3 7.5h4"/><path d="M17 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 16.5h4"/>',
    };

    function buildModeSelector() {
      const items = [
        { mode: 'single', label: 'Camera' },
        { mode: 'grid', label: 'Grid' },
      ];
      if (allowReview) {
        items.push({ mode: 'new', label: 'New alerts & detections', badge: true });
        items.push({ mode: 'retained', label: 'Retained clips' });
      }
      if (allowTimelapse) {
        items.push({ mode: 'timelapse', label: 'Timelapses' });
      }
      modeNav.replaceChildren(...items.map(it => {
        const b = document.createElement('button');
        b.dataset.mode = it.mode;
        b.title = it.label;
        b.setAttribute('aria-label', it.label);
        b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${MODE_ICONS[it.mode]}</svg>`;
        if (it.badge) {
          const s = document.createElement('span');
          s.className = 'badge';
          s.style.display = 'none';
          b.appendChild(s);
        }
        b.addEventListener('click', () => setMode(it.mode));
        return b;
      }));
      updateModeButtons();
    }

    async function refreshNewCount() {
      if (!allowReview) return;
      try {
        const resp = await fetch(`/api/reviews?status=new&_=${Date.now()}`);
        if (!resp.ok) return;
        newCount = (await resp.json()).reviews.length;
        updateModeButtons();
      } catch { /* ignore */ }
    }

    // ---- Config + loop ----

    async function fetchConfig() {
      const resp = await fetch(`/api/config?_=${Date.now()}`);
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.detail || 'config request failed');
      }
      return resp.json();
    }

    function applyFrontendOptions(config) {
      showStats = config.show_stats;
      statsEl.style.display = showStats ? '' : 'none';
      dlBtn.style.display = config.allow_download ? '' : 'none';
      const prevReview = allowReview, prevTl = allowTimelapse;
      allowReview = config.allow_review;
      allowTimelapse = config.allow_timelapse;
      if (prevReview !== allowReview || prevTl !== allowTimelapse) {
        buildModeSelector();
        if (!allowReview && (mode === 'new' || mode === 'retained')) setMode('single');
        if (!allowTimelapse && mode === 'timelapse') setMode('single');
      }
    }

    async function refreshConfig() {
      let config;
      try { config = await fetchConfig(); } catch { return false; }
      applyFrontendOptions(config);
      if (JSON.stringify(config.cameras) === JSON.stringify(cameras)) return false;
      const currentId = cameras[currentIndex]?.id;
      cameras = config.cameras;
      const kept = cameras.findIndex(c => c.id === currentId);
      currentIndex = kept >= 0 ? kept : 0;
      buildGrid();
      if (mode === 'grid') refreshGrid();
      return true;
    }

    async function tick() {
      refreshStats();
      await refreshNewCount();
      const changed = await refreshConfig();
      if (!cameras.length && !isPlayerMode()) { showError('No cameras are configured.'); return; }
      if (mode === 'single') showCamera(changed ? currentIndex : (currentIndex + 1) % cameras.length);
      else if (mode === 'grid') refreshGrid();
      else if (playlist.length === 0) {
        // Player queue has drained: poll for newly-arrived clips and resume.
        // (While clips are playing, the 'ended' handler drives advancement.)
        if (mode !== 'new' || newCount > 0) enterPlayer();
      }
    }

    async function init() {
      let config;
      try { config = await fetchConfig(); }
      catch (exc) { showError(`Failed to load camera configuration: ${exc.message}`); return; }

      cameras = config.cameras;
      rotationInterval = config.rotation_interval;
      applyFrontendOptions(config);
      buildModeSelector();

      buildGrid();
      refreshStats();
      refreshNewCount();
      if (cameras.length) showCamera(0);
      else showError('No cameras are configured.');
      setInterval(tick, rotationInterval * 1000);
    }

    init();
  </script>
</body>
</html>
