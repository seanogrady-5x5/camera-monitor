services:
  # Backend: polls Frigate + Home Assistant, writes images and state to /data
  fetcher:
    build: ./backend
    image: camera-monitor-backend:latest
    command: python fetcher.py
    # Only the fetcher needs Home Assistant credentials. Set HA_URL / HA_TOKEN
    # locally in .env (Compose auto-loads it for ${...}), or as stack
    # environment variables in Portainer. Empty = HA polling is skipped.
    environment:
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
    volumes:
      - camera-data:/data
    restart: unless-stopped

  # Backend: unauthenticated JSON/image API (private network only)
  api:
    build: ./backend
    image: camera-monitor-backend:latest
    command: uvicorn main:app --host 0.0.0.0 --port 8011
    ports:
      - "8011:8011"
    volumes:
      - camera-data:/data
    depends_on:
      - fetcher
    restart: unless-stopped

  # Frontend: monitor page, /api/* proxied to the api service. FRONTEND_NAME
  # selects which cameras/options it gets (frontends table, admin page).
  frontend:
    build: ./frontend
    image: camera-monitor-frontend:latest
    ports:
      - "8010:8010"
    environment:
      LISTEN_PORT: "8010"
      API_UPSTREAM: http://api:8011
      FRONTEND_NAME: private
    depends_on:
      - api
    restart: unless-stopped

  # Example second audience: same image, different frontend name and port.
  # Create the "public" frontend on the admin page and tick its cameras first.
  frontend-public:
    image: camera-monitor-frontend:latest
    ports:
      - "8020:8010"
    environment:
      LISTEN_PORT: "8010"
      API_UPSTREAM: http://api:8011
      FRONTEND_NAME: public
    depends_on:
      - api
    restart: unless-stopped

volumes:
  camera-data:
