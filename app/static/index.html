<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camera Monitor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #frame {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }

    #status-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: 20%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 0.95rem;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      pointer-events: none;
      user-select: none;
    }

    #status-panel h2 {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 0.25rem;
    }

    .sidebar-btn {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      padding: 0.4rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .sidebar-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    #error-overlay {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.75);
      color: #ff5555;
      font-size: 1.1rem;
      text-align: center;
      padding: 2rem;
    }

    #error-overlay.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <img id="frame" alt="" />
  <div id="status-panel">
    <h2>Current Camera</h2>
    <p id="camera-name"></p>
    <button id="download-btn" class="sidebar-btn" disabled>Download Current</button>
    <h2>Image Size</h2>
    <p id="image-size"></p>
    <h2>Status Overlay</h2>
    <p>Content coming soon.</p>
  </div>
  <div id="error-overlay" role="alert"><span id="error-msg"></span></div>

  <script>
    const frameEl    = document.getElementById('frame');
    const nameEl     = document.getElementById('camera-name');
    const sizeEl     = document.getElementById('image-size');
    const dlBtn      = document.getElementById('download-btn');
    const errorEl    = document.getElementById('error-overlay');
    const errorMsgEl = document.getElementById('error-msg');

    let cameras = [];
    let rotationInterval = 10;
    let currentIndex = 0;

    function showError(msg) {
      errorMsgEl.textContent = msg;
      errorEl.classList.add('visible');
      frameEl.style.visibility = 'hidden';
    }

    function hideError() {
      errorEl.classList.remove('visible');
      frameEl.style.visibility = 'visible';
    }

    async function showCamera(index, skipped = 0) {
      if (skipped >= cameras.length) {
        showError('No cameras are currently available.');
        return;
      }

      currentIndex = index;
      const camera = cameras[index];

      try {
        const resp = await fetch(`/api/frame/${index}?_=${Date.now()}`);
        if (!resp.ok) throw new Error('fetch failed');

        const blob = await resp.blob();
        const sizeKB = Math.round(blob.size / 1024);

        const url = URL.createObjectURL(blob);
        frameEl.onload = () => {
          URL.revokeObjectURL(url);
          nameEl.textContent = camera.name;
          sizeEl.textContent = `${sizeKB} kB`;
          dlBtn.disabled = false;
          hideError();
        };
        frameEl.src = url;
      } catch {
        showCamera((index + 1) % cameras.length, skipped + 1);
      }

      // Pre-fetch next camera
      const nextIndex = (index + 1) % cameras.length;
      const prefetch = new Image();
      prefetch.src = `/api/frame/${nextIndex}?_prefetch=1&_=${Date.now()}`;
    }

    dlBtn.addEventListener('click', async () => {
      dlBtn.disabled = true;
      dlBtn.textContent = 'Downloading...';
      try {
        const resp = await fetch(`/api/frame/${currentIndex}/original`);
        if (!resp.ok) throw new Error('download failed');
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${nameEl.textContent || 'frame'}.jpg`;
        a.click();
        URL.revokeObjectURL(url);
      } catch {
        // silent
      } finally {
        dlBtn.disabled = false;
        dlBtn.textContent = 'Download Current';
      }
    });

    async function init() {
      let config;
      try {
        const resp = await fetch('/api/config');
        if (!resp.ok) throw new Error('config request failed');
        config = await resp.json();
      } catch {
        showError('Failed to load camera configuration.');
        return;
      }

      cameras = config.cameras;
      rotationInterval = config.rotation_interval;

      if (!cameras.length) {
        showError('No cameras are configured.');
        return;
      }

      showCamera(0);
      setInterval(() => showCamera((currentIndex + 1) % cameras.length), rotationInterval * 1000);
    }

    init();
  </script>
</body>
</html>
